  <section class="page-title" style="background-image: url('Background.png');">
    <h1>Reserve a Table</h1>
    <p>Tell us when you're coming and we'll save you a seat.</p>
  </section>

  <section class="reserve-section" style="background-color: bisque; text-color: black;"  >
    <form id="reserveForm" class="form" novalidate>
      <label >Name
        <input type="text" id="name" placeholder="Your full name" style="background-color: antiquewhite;">
      </label>

      <label>Phone
        <input type="tel" id="phone" placeholder="Your phone number" style="background-color: antiquewhite;">
      </label>

      <label>Date
        <input type="date" id="date" style="background-color: antiquewhite;">
      </label>

      <label>Time
        <input type="time" id="time" style="background-color: antiquewhite;">
      </label>

      <label>Number of guests
        <input type="number" id="guests" min="1" max="12" value="2" style="background-color: antiquewhite;">
      </label>

      <button type="submit" class="btn">Confirm reservation</button>
      <p id="formMsg" role="status"></p>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
